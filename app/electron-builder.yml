# 钢铁工坊 Windows 安装包配置（electron-builder）
appId: cn.dzyde.steel-workshop
productName: 钢铁工坊
directories:
  output: release
  buildResources: build
files:
  - out/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  executableName: 钢铁工坊
  # 无代码签名证书：SmartScreen 会提示，需用户点「仍要运行」
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 钢铁工坊
  artifactName: 钢铁工坊-setup-${version}.${ext}
  installerLanguages:
    - zh_CN
  language: '2052'
  # 卸载时保留用户设置（模组路径等）
  deleteAppDataOnUninstall: false
  runAfterFinish: true
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
